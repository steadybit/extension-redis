templates:
  - deployment.yaml
  - secret.yaml
chart:
  appVersion: v0.0.0
tests:
  - it: manifest should match snapshot with default values
    asserts:
      - matchSnapshot: {}

  - it: manifest should match snapshot with priority class
    set:
      priorityClassName: my-priority-class
    asserts:
      - matchSnapshot: {}

  - it: manifest should match snapshot with global priority class
    set:
      global:
        priorityClassName: my-global-priority-class
    asserts:
      - matchSnapshot: {}

  - it: manifest should match snapshot with custom certificates and insecureSkipVerify
    set:
      redis:
        insecureSkipVerify: true
      extraVolumeMounts:
        - name: extra-certs
          mountPath: /etc/ssl/extra-certs
          readOnly: true
      extraVolumes:
        - name: extra-certs
          configMap:
            name: redis-self-signed-ca
      extraEnv:
        - name: SSL_CERT_DIR
          value: /etc/ssl/extra-certs:/etc/ssl/certs
    asserts:
      - matchSnapshot: {}
